# Local / VPS stack: PostgreSQL + dashboard + worker. Redis is not needed (the job queue lives in PostgreSQL).
# Usage: cp .env.example .env (fill it), then: docker compose up -d --build
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: pf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pf}
      POSTGRES_DB: prospectforge
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pf -d prospectforge"]
      interval: 5s
      retries: 20

  migrate:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    command: ["npx", "tsx", "scripts/migrate.ts"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://pf:${POSTGRES_PASSWORD:-pf}@postgres:5432/prospectforge
    depends_on:
      postgres: { condition: service_healthy }

  web:
    build: { context: ., dockerfile: docker/web.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://pf:${POSTGRES_PASSWORD:-pf}@postgres:5432/prospectforge
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: { context: ., dockerfile: docker/worker.Dockerfile }
    env_file: .env
    environment:
      DATABASE_URL: postgres://pf:${POSTGRES_PASSWORD:-pf}@postgres:5432/prospectforge
      STORAGE_DIR: /data/storage
    volumes: [storage:/data/storage]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 40s

volumes:
  pgdata:
  storage:
